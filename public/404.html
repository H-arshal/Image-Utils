<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Image Utility</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --color-accent: #c65d21;
        --color-text: #0f172a;
        --color-text-secondary: #64748b;
        --color-border: #e2e8f0;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--color-text);
        background: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        background: #ffffff;
        border: 1px solid var(--color-border);
        border-radius: 16px;
        padding: 48px 32px;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      }
      .code {
        font-size: 4rem;
        font-weight: 800;
        color: var(--color-accent);
        line-height: 1;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin: 0 0 12px;
      }
      p {
        color: var(--color-text-secondary);
        font-size: 0.95rem;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      .btn {
        display: inline-block;
        background: var(--color-accent);
        color: #ffffff;
        padding: 10px 20px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        transition: opacity 0.15s ease;
      }
      .btn:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="code">404</div>
      <h1>Page or Tool Not Found</h1>
      <p>The requested URL does not exist on Image Utility. Explore our 13 free in-browser image tools.</p>
      <a href="/" class="btn">Return to Home</a>
    </main>
  </body>
</html>
